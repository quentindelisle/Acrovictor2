<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acrovictor – Vidéo acrosport</title>
<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Acrovictor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#f1f4fa;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#dbe2ee;--primary:#1e3a8a;--accent:#f97316;--rec:#dc2626;--ok:#15803d;--okbg:#dcefd8;--ko:#b91c1c;--kobg:#f6d2d2;--mult:#c9d9f5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#e6ebf5;color:var(--ink);touch-action:manipulation}
button.primary{background:var(--primary);color:#fff}
button.accent{background:var(--accent);color:#fff}
button.rec{background:var(--rec);color:#fff}
button.danger{background:#fee2e2;color:var(--ko)}
button.on{background:var(--primary);color:#fff}
button:disabled{opacity:.45}
input,textarea,select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{width:100%;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)} .small{font-size:.85rem}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.08);margin-bottom:14px}
.hidden{display:none!important}
h2{font-size:1.2rem;margin:0 0 12px} h3{font-size:1rem;margin:0 0 8px}
header{position:sticky;top:0;z-index:20;background:var(--primary);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;display:flex;align-items:center;gap:10px}
header img{width:34px;height:34px;border-radius:8px}
header b{font-size:1.15rem} header .sig{font-size:.75rem;opacity:.75}
header button{background:rgba(255,255,255,.15);color:#fff}
main{padding:14px;max-width:1400px;margin:0 auto}

.names{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.names{grid-template-columns:1fr}}
.namelist input{width:100%;margin-bottom:8px;font-size:1.05rem}

#evalView{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(340px,1fr);gap:14px;align-items:start}
@media(max-width:900px){#evalView{grid-template-columns:1fr}}
.videobox{position:sticky;top:66px}
.stage{position:relative;background:#0b1020;border-radius:14px;overflow:hidden;aspect-ratio:4/3}
.stage canvas{width:100%;height:100%;object-fit:contain;display:block}
.mirror{transform:scaleX(-1)}
.msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#cbd5e1;text-align:center;gap:12px;padding:20px}
.ov{position:absolute;padding:6px 10px;border-radius:10px;background:rgba(0,0,0,.55);color:#fff;font-weight:600;pointer-events:none}
.ov.tl{top:10px;left:10px;font-size:.95rem}
.ov.tl.buf{font-size:.75rem;font-weight:500;opacity:.8}
.delayctl{display:flex;align-items:center;background:#e6ebf5;border-radius:10px}
.delayctl span{min-width:56px;text-align:center;font-weight:600}
.delayctl button{background:transparent;padding:10px 12px}
#evalView.novideo{grid-template-columns:1fr}
#evalView.novideo .videobox{display:none}
.measurebar{display:flex;gap:8px;margin-top:10px}
.measurebar button{flex:1;font-size:1.15rem;font-weight:700;padding:16px}
button.go{background:var(--ok);color:#fff}
.ov.bl{bottom:10px;left:10px;font-size:1.3rem;background:rgba(21,128,61,.9)}
#ver{position:fixed;left:8px;bottom:6px;font-size:.72rem;color:var(--muted);z-index:50;pointer-events:none}
.ov.tr{top:10px;right:10px;font-size:2.3rem;font-variant-numeric:tabular-nums;min-width:130px;text-align:right}
.vbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.vbar .big{font-size:1.1rem;font-weight:700;padding:14px 22px}
#seek{width:100%;margin-top:10px}
.clips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.clips button{padding:6px 10px;font-size:.85rem}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.modes button{padding:12px;font-weight:600}
.slottabs{display:flex;gap:6px;margin-bottom:10px}
.slottabs button{flex:1;padding:10px;font-weight:600}
.slottabs .sc{display:block;font-size:.78rem;font-weight:400;opacity:.85}
.figpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.figpick div{background:#fff;border:3px solid var(--line);border-radius:12px;padding:6px;text-align:center;cursor:pointer}
.figpick div.on{border-color:#2f55c4;box-shadow:0 0 0 3px #dbe6ff}
.figpick img{width:100%;height:66px;object-fit:contain}
.figpick b{display:block}
.figpick .sc{font-size:.75rem;color:var(--muted)}
.sect{border-radius:12px;padding:10px;margin-bottom:10px}
.sect.okc{background:var(--okbg)} .sect.koc{background:var(--kobg)}
.secth{font-weight:700;margin:2px 4px 8px;display:flex;justify-content:space-between}
.crit{display:flex;align-items:center;gap:12px;padding:11px;border-radius:10px;margin-bottom:4px;cursor:pointer;user-select:none}
.crit .box{width:30px;height:30px;border-radius:8px;border:2px solid #94a3b8;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800}
.okc .crit.on .box{background:var(--ok);border-color:var(--ok);color:#fff}
.koc .crit.on .box{background:var(--ko);border-color:var(--ko);color:#fff}
.crit.on{background:rgba(255,255,255,.55)}
.measure{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;margin-bottom:10px}
.measure .m{background:#f6f8fc;border-radius:12px;padding:10px;text-align:center}
.measure label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
.marks{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.marks button{padding:8px 10px;font-size:.85rem}
.timein input{width:90px;font-size:1.4rem;font-weight:700;text-align:center;padding:6px}
.stepper{display:flex;align-items:center;justify-content:center;gap:8px}
.stepper button{width:46px;height:46px;font-size:1.4rem;font-weight:700;padding:0}
.stepper output{font-size:1.8rem;font-weight:700;min-width:40px}
.scorebox{background:var(--mult);border-radius:12px;padding:10px;text-align:center;margin-bottom:10px}
.scorebox .val{font-size:2rem;font-weight:800;color:var(--primary)}
.multtable{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px;font-size:.78rem}
.multtable div{background:#fff;border-radius:6px;padding:4px}
.multtable div.on{background:var(--primary);color:#fff;font-weight:700}
table{border-collapse:collapse;width:100%}
th,td{padding:7px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:.78rem;color:var(--muted);text-transform:uppercase}
.total{background:#0f172a;color:#fff;border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;margin:10px 0}
.total b{font-size:1.6rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;z-index:100}
dialog{border:0;border-radius:16px;padding:18px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(15,23,42,.45)}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:16px}
</style>
</head>
<body>
<header>
  <img src="icons/icon-192.png" alt="">
  <div><b>Acrovictor</b><div class="sig">Vidéo acrosport · N'EPS by Quentin Delisle</div></div>
  <span class="spacer"></span>
  <button id="btnHist">📋 Résultats</button>
  <button id="btnSettings">⚙️</button>
</header>

<main>
<!-- ===== 1. NOMS ===== -->
<section id="namesView">
  <div class="card">
    <h2>Noms des élèves <span class="muted small">(groupe de 4 à 7)</span></h2>
    <div class="names">
      <div class="namelist"><h3>🤸 Gymnastes</h3><div id="gymList"></div><button id="addGym">+ Ajouter un gymnaste</button></div>
      <div class="namelist"><h3>👁️ Observateurs</h3><div id="obsList"></div><button id="addObs">+ Ajouter un observateur</button></div>
    </div>
    <div class="row" style="margin-top:16px"><span id="nameStatus" class="small muted"></span><span class="spacer"></span>
      <button class="primary" id="btnGo" style="font-size:1.1rem;padding:14px 22px">Passer à la vidéo ▶</button></div>
  </div>
</section>

<!-- ===== 2. VIDÉO + FICHE ===== -->
<section id="evalView" class="hidden">
  <div class="videobox">
    <div class="stage">
      <canvas id="disp" width="640" height="480"></canvas>
      <div class="msg" id="stageMsg"><div>📷 Appuyez sur Start pour filmer</div></div>
      <div class="ov tl" id="ovState">Délay</div>
      <div class="ov tr" id="ovChrono">0,0 s</div>
      <div class="ov bl hidden" id="ovMeas"></div>
    </div>
    <div class="measurebar"><button class="go" id="bDeb">▶ Début</button><button class="rec" id="bFin">■ Fin</button></div>
    <div class="vbar" id="barLive">
      <button class="big rec" id="btnStart">● Start</button>
      <button id="btnReview" disabled>⏸ Relire</button>
      <span class="spacer"></span>
      <div class="delayctl" title="Délay"><button id="dMinus">−</button><span id="dVal">5 s</span><button id="dPlus">+</button></div>
      <button id="btnMirror" title="Miroir">⇋</button>
      <button id="btnSwitchCam" title="Changer de caméra">🔄</button>
      <button id="btnHideVid" title="Masquer la vidéo">🙈 Masquer</button>
    </div>
    <div id="barReplay" class="hidden">
      <input type="range" id="seek" min="0" max="1000" value="1000" step="1">
      <div class="vbar">
        <button id="bBack">« 1 s</button>
        <button id="bFrameB">‹ 0,1</button>
        <button class="big primary" id="bPlay">▶</button>
        <button id="bFrameF">0,1 ›</button>
        <button id="bFwd">1 s »</button>
        <button id="bSlow">Vitesse ×1</button>
        <span class="spacer"></span>
        <button class="accent" id="btnLive">⏭ Retour au délay</button>
      </div>
    </div>
  </div>
  <div class="card" id="panel"></div>
</section>

<!-- ===== RÉSULTATS ===== -->
<section id="histView" class="hidden">
  <div class="card">
    <div class="row"><h2 style="margin:0">Résultats enregistrés</h2><span class="spacer"></span>
      <button class="primary" id="btnExport">⬇️ Export Excel</button><button id="btnBack">← Retour</button></div>
  </div>
  <div class="card"><table id="histTable"></table>
    <div class="row" style="margin-top:12px"><span class="spacer"></span><button class="danger" id="btnWipe">Tout effacer</button></div></div>
</section>
</main>
<footer>Acrovictor · N'EPS by Quentin Delisle</footer>
<div id="ver"></div>

<dialog id="dlgSet"><form method="dialog">
  <h3>Réglages vidéo</h3>
  <div class="row"><span>Qualité (largeur px)</span><span class="spacer"></span><select id="sRes"><option>480</option><option>640</option><option>960</option><option>1280</option><option>1920</option></select></div>
  <div class="row" style="margin-top:14px"><span class="spacer"></span><button class="primary" value="ok">OK</button></div>
</form></dialog>

<script src="lib/xlsx.full.min.js"></script>
<script>
"use strict";
/* ===== Fiche ===== */
const FIGS={A:'img/figure-a.png',B:'img/figure-b.png',C:'img/figure-c.png'};
const INDISP=['La figure est tenue 3 secondes',"Aucun des gymnastes n'a marché pour se mettre en place",'Le dos des gymnastes est droit'];
const PENS=['Ajustements pendant le montage / démontage','Communication inutile','Gestes parasites (main dans les cheveux, …)'];
/* Multiplicateur : 5 à 10 s → x1 ; 10 à 14 s → x1,5 ; + de 14 s → x2 */
function multFor(t){ if(t==null||isNaN(t)) return null; return t<10?1:(t<=14?1.5:2); }

const APP_VERSION='1.5.0';
const KEY='acrovictor.v3';
let S=load();
function load(){ try{const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.results) return s;}catch(e){} return {results:[],settings:{delay:5,res:960,mirror:false}}; }
function save(){ localStorage.setItem(KEY,JSON.stringify(S)); }
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'–':Number(n).toLocaleString('fr-FR',{maximumFractionDigits:2});
const fmtT=n=>n==null||!isFinite(n)?'–':Number(n).toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1})+' s';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400);}

/* ===== Calcul ===== */
const newSlot=()=>({fig:null,debut:null,fin:null,time:null,steps:0,indisp:[false,false,false],pen:[false,false,false],amelio:''});
function slotScore(s){
  const valid=s.indisp.every(Boolean), nPen=s.pen.filter(Boolean).length, m=multFor(s.time);
  if(!valid) return {valid,score:0,m,nPen};
  if(m==null) return {valid,score:null,m,nPen};
  return {valid,score:Math.max(0,m*s.steps-nPen),m,nPen};
}
function essaisOf(G,k){ return G.videos.flatMap(v=>v.figs.filter(f=>f.fig===k)); }
function figFinal(G,k){ const sc=essaisOf(G,k).map(f=>slotScore(f).score).filter(x=>x!=null); return sc.length?Math.max(...sc):null; }
function groupTotal(G){ const v=['A','B','C'].map(k=>figFinal(G,k)).filter(x=>x!=null).sort((a,b)=>b-a).slice(0,2); return v.length?v.reduce((a,b)=>a+b,0):null; }

/* ===== 1. Noms ===== */
let names={gym:['','',''],obs:['']};
function renderNames(){
  for(const k of ['gym','obs']) $('#'+k+'List').innerHTML=names[k].map((v,i)=>`<input data-k="${k}" data-i="${i}" value="${esc(v)}" placeholder="${k==='gym'?'Gymnaste':'Observateur'} ${i+1}" autocomplete="off">`).join('');
  status();
}
function status(){
  const g=names.gym.filter(x=>x.trim()).length, o=names.obs.filter(x=>x.trim()).length, n=g+o;
  $('#nameStatus').textContent=`${g} gymnaste(s) · ${o} observateur(s) · ${n} élèves${n&&(n<4||n>7)?' ⚠️ groupe de 4 à 7':''}`;
  $('#btnGo').disabled=!g;
}
document.addEventListener('input',e=>{ const t=e.target; if(t.dataset.k){ names[t.dataset.k][+t.dataset.i]=t.value; status(); } });
$('#addGym').onclick=()=>{ names.gym.push(''); renderNames(); $('#gymList').lastElementChild.focus(); };
$('#addObs').onclick=()=>{ names.obs.push(''); renderNames(); $('#obsList').lastElementChild.focus(); };
$('#btnGo').onclick=()=>{
  G={id:Date.now().toString(36),date:new Date().toISOString(),gym:names.gym.map(s=>s.trim()).filter(Boolean),obs:names.obs.map(s=>s.trim()).filter(Boolean),videos:[]};
  newEval(); vidHidden=false; $('#evalView').classList.remove('novideo'); show('eval');
};
function show(v){ ['names','eval','hist'].forEach(x=>$('#'+x+'View').classList.toggle('hidden',x!==v)); if(v!=='eval'){ camStop(); clearClips(); } window.scrollTo(0,0); }

/* ===== 2. Fiche (après la vidéo) ===== */
let G=null, cur=null;   // G = groupe ; cur = évaluation de la vidéo en cours
function newEval(){ cur={mode:1,slot:0,slots:[newSlot(),newSlot()],clip:null}; renderPanel(); }
function S_(){ return cur.slots[cur.slot]; }
function essaiNum(k){ return essaisOf(G,k).length + cur.slots.slice(0,cur.mode).filter((s,i)=>s.fig===k && i<=cur.slot).length; }

function renderPanel(){
  if(!G) return;
  const s=S_(), sc=slotScore(s), m=sc.m;
  const slotTab=i=>{const x=cur.slots[i],r=slotScore(x);return `<button data-slot="${i}" class="${i===cur.slot?'on':''}">Figure ${i+1}${x.fig?' : '+x.fig:''}<span class="sc">${x.fig?(r.valid?(r.score!=null?fmt(r.score)+' pts':'temps ?'):'non validée · 0'):'à choisir'}</span></button>`;};
  const figBox=k=>{const n=essaisOf(G,k).length;return `<div data-fig="${k}" class="${s.fig===k?'on':''}"><img src="${FIGS[k]}" alt=""><b>${k}</b><span class="sc">${n?n+' essai'+(n>1?'s':'')+' · '+fmt(figFinal(G,k))+' pts':'—'}</span></div>`;};
  const formula=!s.fig?'Choisissez la figure vue':(!sc.valid?'Critère indispensable manquant → 0':(m==null?'Mesurez le temps':`x${fmt(m)} × ${s.steps} étape${s.steps>1?'s':''}${sc.nPen?` − ${sc.nPen} pénalité${sc.nPen>1?'s':''}`:''}`));
  const en=s.fig?essaiNum(s.fig):null;
  $('#panel').innerHTML=`
    ${vidHidden?'<button class="accent" id="btnShowVid" style="width:100%;margin-bottom:10px">📹 Afficher la vidéo</button>':''}
    <div class="small"><b>🤸 ${G.gym.map(esc).join(', ')}</b><br><span class="muted">👁️ ${G.obs.map(esc).join(', ')||'—'}</span></div>
    <h3 style="margin-top:12px">Vidéo ${G.videos.length+1} — j'observe :</h3>
    <div class="modes"><button data-mode="1" class="${cur.mode===1?'on':''}">1 figure</button><button data-mode="2" class="${cur.mode===2?'on':''}">Un enchaînement de 2 figures</button></div>
    ${cur.mode===2?`<div class="slottabs">${slotTab(0)}${slotTab(1)}</div>`:''}
    <div class="small muted" style="margin-bottom:6px">Figure vue ${cur.mode===2?(cur.slot===0?'en 1ᵉʳ':'en 2ᵉ'):''} :</div>
    <div class="figpick">${figBox('A')}${figBox('B')}${figBox('C')}</div>
    ${en?`<div class="small" style="margin:-4px 0 10px"><b>Figure ${s.fig} · essai ${en}</b>${en>2?' <span style="color:#9a5b00">(au-delà de 2 essais, le meilleur est retenu)</span>':''}</div>`:''}
    <div class="sect okc"><div class="secth"><span>Indispensable !</span><span>${s.indisp.filter(Boolean).length}/3</span></div>
      ${INDISP.map((t,i)=>`<div class="crit ${s.indisp[i]?'on':''}" data-ind="${i}"><span class="box">${s.indisp[i]?'✓':''}</span>${esc(t)}</div>`).join('')}</div>
    <div class="sect koc"><div class="secth"><span>Pénalités (+1 point)</span><span>${sc.nPen}</span></div>
      ${PENS.map((t,i)=>`<div class="crit ${s.pen[i]?'on':''}" data-pen="${i}"><span class="box">${s.pen[i]?'+1':''}</span>${esc(t)}</div>`).join('')}</div>
    <div class="measure">
      <div class="m"><label>Temps (boutons Début / Fin sous la vidéo)</label>
        <div class="small muted" style="margin-bottom:6px">Début ${fmtT(s.debut)} · Fin ${fmtT(s.fin)}</div>
        <div class="timein"><input id="inTime" inputmode="decimal" value="${s.time!=null?String(s.time).replace('.',','):''}" placeholder="–"> s</div></div>
      <div class="m"><label>Nombre d'étapes</label><div class="stepper"><button data-step="-1">−</button><output>${s.steps}</output><button data-step="1">+</button></div></div>
    </div>
    <div class="scorebox"><div class="small">Score : multiplicateur × nb d'étapes</div><div>${formula}</div>
      <div class="val">${s.fig&&sc.score!=null?fmt(sc.score):'–'} <span class="small">pts</span></div>
      <div class="multtable"><div class="${m===1?'on':''}">5 à 10 s<br>x1</div><div class="${m===1.5?'on':''}">10 à 14 s<br>x1,5</div><div class="${m===2?'on':''}">+ de 14 s<br>x2</div></div>
      ${s.time!=null&&s.time<5?'<div class="small" style="color:#9a5b00;margin-top:6px">⚠️ moins de 5 s</div>':''}
    </div>
    <label class="small muted">Proposition d'amélioration</label>
    <textarea id="inAmelio" rows="2">${esc(s.amelio)}</textarea>
    <button class="primary" id="btnSaveVid" style="width:100%;margin-top:12px;padding:14px;font-weight:700">✔ Valider cette vidéo</button>
    ${recap()}
    <div class="row"><button class="danger" id="btnCancel">Abandonner le groupe</button><span class="spacer"></span><button class="accent" id="btnFinish">💾 Terminer le groupe</button></div>`;
}
function recap(){
  if(!G.videos.length) return '<p class="small muted" style="margin-top:12px">Aucune vidéo validée pour ce groupe.</p>';
  const rows=['A','B','C'].map(k=>{const e=essaisOf(G,k); if(!e.length) return ''; return `<tr><td><b>${k}</b></td>${[0,1].map(i=>`<td>${e[i]?fmt(slotScore(e[i]).score)+` <span class="small muted">(${fmtT(e[i].time)} · ${e[i].steps} ét.)</span>`:'–'}</td>`).join('')}<td><b>${fmt(figFinal(G,k))}</b></td></tr>`;}).join('');
  return `<h3 style="margin-top:14px">Récapitulatif du groupe</h3><table><tr><th>Fig.</th><th>Essai 1</th><th>Essai 2</th><th>Final</th></tr>${rows}</table>
    <div class="total"><span>Total (2 meilleures figures)</span><b>${fmt(groupTotal(G))} pts</b></div>`;
}
$('#panel').addEventListener('click',ev=>{
  if(ev.target.closest('#btnShowVid')){ setVidHidden(false); return; }
  const t=ev.target.closest('[data-mode],[data-slot],[data-fig],[data-ind],[data-pen],[data-step],#btnSaveVid,#btnFinish,#btnCancel'); if(!t) return;
  const s=S_();
  if(t.dataset.mode){ cur.mode=+t.dataset.mode; if(cur.mode===1) cur.slot=0; }
  else if(t.dataset.slot!=null) cur.slot=+t.dataset.slot;
  else if(t.dataset.fig) s.fig=t.dataset.fig;
  else if(t.dataset.ind!=null) s.indisp[+t.dataset.ind]=!s.indisp[+t.dataset.ind];
  else if(t.dataset.pen!=null) s.pen[+t.dataset.pen]=!s.pen[+t.dataset.pen];
  else if(t.dataset.step!=null) s.steps=Math.max(0,Math.min(50,s.steps+ +t.dataset.step));
  else if(t.id==='btnSaveVid'){
    const used=cur.slots.slice(0,cur.mode);
    if(used.some(x=>!x.fig)){ toast('Choisissez la figure vue'+(cur.mode===2?' (figures 1 et 2)':'')); return; }
    if(cur.mode===2&&used[0].fig===used[1].fig&&!confirm('Les 2 figures sont identiques. Continuer ?')) return;
    if(used.some(x=>x.time==null)&&!confirm('Un temps n\'est pas mesuré. Valider quand même ?')) return;
    G.videos.push({n:G.videos.length+1,mode:cur.mode,date:new Date().toISOString(),figs:structuredClone(used)});
    toast('Vidéo '+G.videos.length+' validée ✔'); newEval(); return;
  }
  else if(t.id==='btnFinish'){
    if(!G.videos.length&&!confirm('Aucune vidéo validée. Terminer quand même ?')) return;
    if(G.videos.length){ S.results.push(G); save(); toast('Groupe enregistré ✔'); }
    G=null; names={gym:['','',''],obs:['']}; renderNames(); show('names'); return;
  }
  else if(t.id==='btnCancel'){ if(confirm('Abandonner ce groupe sans enregistrer ?')){ G=null; show('names'); } return; }
  renderPanel();
});
$('#panel').addEventListener('change',ev=>{
  if(ev.target.id==='inTime'){ const v=parseFloat(ev.target.value.replace(',','.')); S_().time=isNaN(v)?null:Math.round(v*10)/10; renderPanel(); }
});
$('#panel').addEventListener('input',ev=>{ if(ev.target.id==='inAmelio') S_().amelio=ev.target.value; });

/* ===== Vidéo délay (start immédiat, relecture du buffer) ===== */
const disp=$('#disp'), dctx=disp.getContext('2d');
const vid=document.createElement('video'); vid.muted=true; vid.playsInline=true; vid.setAttribute('playsinline','');
const cap=document.createElement('canvas'), cctx=cap.getContext('2d');
const KEEP=90, FPS=15;   // secondes conservées pour la relecture
let stream=null, devices=[], devIdx=0, frames=[], pending=0, capTimer=null, shown=null, decoding=false;
let state='off', startT=null, displayedT=null, reviewT=null, reviewPlay=false, slow=false, lastTick=performance.now();

async function camStart(deviceId){
  if(!navigator.mediaDevices?.getUserMedia){ toast('Caméra indisponible (HTTPS requis)'); return false; }
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    const w=S.settings.res;
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:deviceId?{deviceId:{exact:deviceId},width:{ideal:w}}:{facingMode:'environment',width:{ideal:w}}});
    vid.srcObject=stream; await vid.play().catch(()=>{});
    devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
    const id=stream.getVideoTracks()[0].getSettings().deviceId; devIdx=Math.max(0,devices.findIndex(d=>d.deviceId===id));
    return true;
  }catch(err){ toast('Caméra refusée : '+err.message); return false; }
}
function camStop(){ clearTimeout(capTimer); capTimer=null; if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null;} frames=[]; shown=null; displayedT=null; startT=null; setState('off'); dctx.clearRect(0,0,disp.width,disp.height); }
function setState(st){
  state=st;
  $('#stageMsg').classList.toggle('hidden',st!=='off');
  $('#barReplay').classList.toggle('hidden',st!=='review');
  $('#btnReview').disabled=st==='off';
  $('#btnReview').textContent=st==='review'?'▶ Reprendre le délay':'⏸ Relire';
  $('#btnStart').textContent=st==='off'?'● Start':'↺ Nouveau départ';
  if(st!=='review'){ reviewPlay=false; }
  $('#bPlay').textContent=reviewPlay?'⏸':'▶';
}
async function startRun(){
  if(!stream && !(await camStart())) return;
  frames=[]; shown=null; displayedT=null; startT=performance.now(); dctx.clearRect(0,0,disp.width,disp.height);
  setState('run'); clearTimeout(capTimer); capLoop();
}
function capLoop(){
  if(!stream) return; const t0=performance.now();
  if(vid.readyState>=2&&vid.videoWidth&&pending<3){
    const w=Math.min(S.settings.res,vid.videoWidth), h=Math.round(w*vid.videoHeight/vid.videoWidth);
    if(cap.width!==w||cap.height!==h){cap.width=w;cap.height=h;}
    cctx.drawImage(vid,0,0,w,h); const t=performance.now(); pending++;
    cap.toBlob(b=>{pending--; if(b){frames.push({t,b}); if(frames.length>1&&frames[frames.length-2].t>t) frames.sort((x,y)=>x.t-y.t);}},'image/jpeg',0.72);
  }
  const lim=performance.now()-KEEP*1000; let k=0; while(k<frames.length-1&&frames[k+1].t<lim) k++; if(k) frames.splice(0,k);
  capTimer=setTimeout(capLoop,Math.max(5,1000/FPS-(performance.now()-t0)));
}
function frameAt(t){let lo=0,hi=frames.length-1,r=-1;while(lo<=hi){const m=(lo+hi)>>1;if(frames[m].t<=t){r=m;lo=m+1;}else hi=m-1;}return r;}
function drawFrame(f){
  decoding=true;
  const done=img=>{ if(disp.width!==img.width||disp.height!==img.height){disp.width=img.width;disp.height=img.height;} dctx.drawImage(img,0,0); decoding=false; };
  if(window.createImageBitmap) createImageBitmap(f.b).then(b=>{done(b);b.close&&b.close();}).catch(()=>decoding=false);
  else { const u=URL.createObjectURL(f.b),im=new Image(); im.onload=()=>{done(im);URL.revokeObjectURL(u);}; im.onerror=()=>decoding=false; im.src=u; }
}
const liveEdge=()=>performance.now()-S.settings.delay*1000;
function tick(){
  requestAnimationFrame(tick);
  const now=performance.now(), dt=now-lastTick; lastTick=now;
  const st=$('#ovState'); st.classList.remove('buf');
  if(state==='off'){ $('#ovChrono').textContent='0,0 s'; st.textContent='Délay '+S.settings.delay+' s'; return; }
  let target;
  if(state==='review'){
    if(reviewPlay){ reviewT+=dt*(slow?0.5:1); if(reviewT>=liveEdge()){ setState('run'); } }
    target= state==='review' ? reviewT : liveEdge();
  } else target=liveEdge();
  const i=frameAt(target);
  if(i<0){ displayedT=null; if(shown){ shown=null; dctx.clearRect(0,0,disp.width,disp.height); } st.textContent='buffering…'; st.classList.add('buf'); $('#ovChrono').textContent='0,0 s'; drawMeasure(); return; }
  const f=frames[i]; if(f!==shown&&!decoding){ shown=f; drawFrame(f); }
  displayedT=shown?shown.t:null;
  st.textContent= state==='review' ? 'Relecture' : 'Délay '+S.settings.delay+' s';
  $('#ovChrono').textContent= displayedT!=null ? fmtT((displayedT-startT)/1000) : '0,0 s';
  drawMeasure();
  if(state==='review' && frames.length && document.activeElement!==$('#seek')){
    const a=frames[0].t, z=Math.max(a+1,liveEdge()); $('#seek').value=Math.round((reviewT-a)/(z-a)*1000);
  }
}
function curVideoTime(){ return displayedT!=null&&startT!=null ? Math.round((displayedT-startT)/100)/10 : null; }
$('#btnStart').onclick=startRun;
$('#btnReview').onclick=()=>{
  if(state==='review'){ setState('run'); return; }
  if(displayedT==null){ toast('Pas encore d\'image à relire'); return; }
  reviewT=displayedT; reviewPlay=false; setState('review');
};
$('#btnLive').onclick=()=>setState('run');
$('#bPlay').onclick=()=>{ reviewPlay=!reviewPlay; $('#bPlay').textContent=reviewPlay?'⏸':'▶'; };
const seekBy=d=>{ if(state!=='review'||!frames.length) return; reviewPlay=false; $('#bPlay').textContent='▶'; reviewT=Math.max(frames[0].t,Math.min(liveEdge(),reviewT+d*1000)); };
$('#bBack').onclick=()=>seekBy(-1); $('#bFwd').onclick=()=>seekBy(1);
$('#bFrameB').onclick=()=>seekBy(-0.1); $('#bFrameF').onclick=()=>seekBy(0.1);
$('#bSlow').onclick=()=>{ slow=!slow; $('#bSlow').textContent='Vitesse ×'+(slow?'0,5':'1'); };
$('#seek').addEventListener('input',e=>{ if(!frames.length) return; reviewPlay=false; $('#bPlay').textContent='▶'; const a=frames[0].t, z=Math.max(a+1,liveEdge()); reviewT=a+(z-a)*e.target.value/1000; });
function setDelay(d){ S.settings.delay=Math.max(1,Math.min(30,d)); $('#dVal').textContent=S.settings.delay+' s'; save(); }
$('#dMinus').onclick=()=>setDelay(S.settings.delay-1);
$('#dPlus').onclick=()=>setDelay(S.settings.delay+1);
$('#btnSwitchCam').onclick=()=>{ if(devices.length<2){toast('Une seule caméra');return;} devIdx=(devIdx+1)%devices.length; camStart(devices[devIdx].deviceId); };
function applyMirror(){ disp.classList.toggle('mirror',!!S.settings.mirror); }
$('#btnMirror').onclick=()=>{ S.settings.mirror=!S.settings.mirror; save(); applyMirror(); };
function clearClips(){}
/* Début / Fin : calcul automatique du temps dans la fiche (figure active) */
$('#bDeb').onclick=()=>{
  const vt=curVideoTime(); if(vt==null){ toast('Pas encore d\'image à l\'écran'); return; }
  const s=S_(); s.debut=vt; s.fin=null; s.time=null; renderPanel(); toast('Début : '+fmtT(vt));
};
$('#bFin').onclick=()=>{
  const vt=curVideoTime(), s=S_(); if(vt==null){ toast('Pas encore d\'image à l\'écran'); return; }
  if(s.debut==null){ toast('Appuyez d\'abord sur Début'); return; }
  if(vt<s.debut){ toast('La fin est avant le début'); return; }
  s.fin=vt; s.time=Math.round((s.fin-s.debut)*10)/10; renderPanel(); toast('Temps : '+fmtT(s.time));
};
let vidHidden=false;
function setVidHidden(h){ vidHidden=h; $('#evalView').classList.toggle('novideo',h); renderPanel(); }
$('#btnHideVid').onclick=()=>setVidHidden(true);
function drawMeasure(){
  const o=$('#ovMeas'); const s=cur&&G?S_():null; const vt=curVideoTime();
  if(!s||s.debut==null){ o.classList.add('hidden'); return; }
  const t = s.fin!=null ? s.time : (vt!=null&&vt>=s.debut ? vt-s.debut : null);
  if(t==null){ o.classList.add('hidden'); return; }
  o.classList.remove('hidden'); o.textContent=(s.fin!=null?'Temps : ':'⏱ ')+fmtT(t);
}


/* ===== Réglages ===== */
$('#btnSettings').onclick=()=>{ $('#sRes').value=S.settings.res; $('#dlgSet').showModal(); };
$('#dlgSet').addEventListener('close',()=>{ const r=+$('#sRes').value, ch=r!==S.settings.res; S.settings.res=r; save(); if(ch&&stream) camStart(devices[devIdx]?.deviceId); });

/* ===== Résultats + export ===== */
$('#btnHist').onclick=()=>{ if(G&&!confirm('Quitter le groupe en cours ? (non enregistré)')) return; G=null; renderHist(); show('hist'); };
$('#btnBack').onclick=()=>{ renderNames(); show('names'); };
function renderHist(){
  $('#histTable').innerHTML=S.results.length?`<tr><th>Heure</th><th>Gymnastes</th><th>Observateurs</th><th>Vidéos</th><th>A</th><th>B</th><th>C</th><th>Total</th><th></th></tr>`+
    S.results.map((r,i)=>`<tr><td class="small">${new Date(r.date).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</td><td>${r.gym.map(esc).join(', ')}</td><td class="small">${r.obs.map(esc).join(', ')}</td><td>${r.videos.length}</td>${['A','B','C'].map(k=>`<td>${fmt(figFinal(r,k))}</td>`).join('')}<td><b>${fmt(groupTotal(r))}</b></td><td><button data-del="${i}">🗑️</button></td></tr>`).join('')
    :'<tr><td class="muted">Aucun résultat.</td></tr>';
}
$('#histTable').addEventListener('click',e=>{ const b=e.target.closest('[data-del]'); if(b&&confirm('Supprimer ?')){ S.results.splice(+b.dataset.del,1); save(); renderHist(); } });
$('#btnWipe').onclick=()=>{ if(confirm('Effacer tous les résultats ?')){ S.results=[]; save(); renderHist(); } };
$('#btnExport').onclick=()=>{
  if(!S.results.length){ toast('Aucun résultat'); return; }
  const yn=b=>b?'Oui':'Non', wb=XLSX.utils.book_new(), d=r=>new Date(r.date).toLocaleString('fr-FR');
  const r1=[['Date','Gymnastes','Observateurs','Nb vidéos','Score final A','Score final B','Score final C','Total (2 meilleures)']];
  S.results.forEach(r=>r1.push([d(r),r.gym.join(', '),r.obs.join(', '),r.videos.length,...['A','B','C'].map(k=>figFinal(r,k)??''),groupTotal(r)??'']));
  const ws1=XLSX.utils.aoa_to_sheet(r1); ws1['!cols']=[{wch:18},{wch:34},{wch:28},{wch:9},{wch:12},{wch:12},{wch:12},{wch:16}];
  XLSX.utils.book_append_sheet(wb,ws1,'Synthèse');
  const r2=[['Date','Gymnastes','Observateurs','Vidéo n°','Mode','Ordre','Figure','Essai n°',...INDISP,'Figure validée',...PENS,'Début (s)','Fin (s)','Temps (s)','Multiplicateur','Nb étapes','Score','Proposition d\'amélioration']];
  S.results.forEach(r=>{ const cnt={};
    r.videos.forEach(v=>v.figs.forEach((f,j)=>{ cnt[f.fig]=(cnt[f.fig]||0)+1; const s=slotScore(f);
      r2.push([d(r),r.gym.join(', '),r.obs.join(', '),v.n,v.mode===2?'Enchaînement 2 figures':'1 figure',j+1,f.fig,cnt[f.fig],...f.indisp.map(yn),yn(s.valid),...f.pen.map(yn),f.debut??'',f.fin??'',f.time??'',s.m??'',f.steps,s.score??'',f.amelio||'']); })); });
  const ws2=XLSX.utils.aoa_to_sheet(r2); ws2['!cols']=[{wch:18},{wch:30},{wch:26},{wch:8},{wch:20},{wch:6},{wch:7},{wch:7},{wch:14},{wch:14},{wch:14},{wch:10},{wch:14},{wch:14},{wch:14},{wch:8},{wch:8},{wch:9},{wch:12},{wch:9},{wch:8},{wch:36}];
  XLSX.utils.book_append_sheet(wb,ws2,'Détail des figures');
  XLSX.writeFile(wb,'Acrosport_resultats_'+new Date().toISOString().slice(0,10)+'.xlsx');
};

/* ===== Init ===== */
if(S.settings.delay==null) S.settings.delay=5;
$('#ver').textContent='v'+APP_VERSION; setDelay(S.settings.delay); applyMirror(); renderNames(); setState('off'); requestAnimationFrame(tick);
window.addEventListener('beforeunload',e=>{ if(G){ e.preventDefault(); e.returnValue=''; } });
if('serviceWorker' in navigator&&location.protocol!=='file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
